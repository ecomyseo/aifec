# AIFEC: incluir dentro de server {}, antes de una regla general que deniegue archivos ocultos.
# Conservar el root y el bloque PHP/FastCGI de la instalación actual.
location = /.well-known/ucp { rewrite ^ /index.php last; }
location = /.well-known/acp.json { rewrite ^ /index.php last; }
location = /.well-known/acp { rewrite ^ /index.php last; }
location ^~ /.well-known/ucp/ { rewrite ^ /index.php last; }

# Tiendas con un prefijo de URL alojadas por la misma entrada de AIFEC.
# Esta expresión debe aparecer antes de una expresión general que bloquee /.
location ~ "^/(?:[^/]+/)+\.well-known/(?:ucp(?:/[0-9]{4}-[0-9]{2}-[0-9]{2})?|acp(?:\.json)?)/?$" {
    rewrite ^ /index.php last;
}

# El location / existente debe conservar la URL y la consulta originales:
# try_files $uri /index.php?$query_string;
# En el bloque PHP existente, conservar:
# fastcgi_param HTTP_AUTHORIZATION $http_authorization;
# fastcgi_param REQUEST_URI $request_uri;

# No duplicar otro location / ni sustituir la configuración de certificados o de ACME.
